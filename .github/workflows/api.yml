name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/plant-identifier-api
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-report
          path: api/pytest-report.xml

  docker:
    name: Build, smoke test and publish image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create dummy model for the smoke test
        working-directory: api
        run: |
          pip install onnx numpy pillow
          python -m tests.dummy_model models/
          python -c "from PIL import Image; Image.new('RGB', (640, 480), (60, 140, 60)).save('/tmp/leaf.jpg')"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: plant-identifier-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/api/models:/app/models:ro" plant-identifier-api:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/readyz; then break; fi
            sleep 1
          done
          echo
          curl -fsS localhost:8000/readyz
          echo
          test "$(docker exec api id -u)" = "10001" || { echo "Container must run as UID 10001"; exit 1; }
          curl -fsS -F "image=@/tmp/leaf.jpg" localhost:8000/predict -o /tmp/predict.json
          python - <<'EOF'
          import json
          r = json.load(open("/tmp/predict.json"))
          assert r["plant"]["id"] == "Tomato", r
          assert r["condition_status"] == "assessed", r
          assert len(r["top_predictions"]) == 3, r
          print("predict OK:", r["plant"], r["condition"]["label"])
          EOF
          curl -fsS localhost:8000/plants/Tomato > /dev/null
          curl -fsS localhost:8000/metrics | grep -q "predictions_total"

      - name: Container logs
        if: always()
        run: docker logs api || true

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: plant-identifier-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: plant-identifier-api:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
