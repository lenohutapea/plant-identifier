name: k8s

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/k8s.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/k8s.yml"
  workflow_dispatch:

jobs:
  kubeconform:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render Kustomize
        run: kubectl kustomize deploy/k8s > rendered.yaml

      - name: Validate
        run: kubeconform -strict -summary -output pretty rendered.yaml
